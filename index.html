<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Management Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    
    <div class="container">
      <main class="main-content">
    
        <header id="dashboard">
          <div>
            <h1>Budget App</h1>
            <p class="subtitle">Manage your income and expenses.</p>
          </div>
        </header>

        
        <section class="cards">
          <div class="card balance">
            <p>Total Balance</p>
            <h2 id="balance">Rs. 0</h2>
          </div>

          <div class="card income">
            <p>Total Income</p>
            <h2 id="income">Rs. 0</h2>
          </div>

          <div class="card expense">
            <p>Total Expenses</p>
            <h2 id="expenses">Rs. 0</h2>
          </div>
        </section>

        <!-- Transaction Form -->
        <section class="section" id="add-transaction">
          <h2>Add Transaction</h2>
          <p class="section-text">Enter your income or expense details.</p>

          <form id="budgetForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="type">Transaction Type</label>

                <select id="type">
                  <option value="income">Income</option>
                  <option value="expense">Expense</option>
                </select>
              </div>

              <div class="form-group">
                <label for="amount">Amount (Rs.)</label>

                <input
                  type="number"
                  id="amount"
                  placeholder="Enter amount"
                  min="0.01"
                  step="0.01"
                  required
                />
              </div>

              <div class="form-group">
                <label for="category">Category</label>

                <input
                  type="text"
                  id="category"
                  placeholder="e.g. Salary, Food"
                  maxlength="50"
                  required
                />
              </div>
            </div>

            <button type="submit">Add Transaction</button>
          </form>
        </section>

        <!-- Transaction History -->
        <section class="section" id="history">
          <div class="history-heading">
            <div>
              <h2>Transaction History</h2>
              <p class="section-text">All your income and expenses.</p>
            </div>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Type</th>
                  <th>Amount</th>
                </tr>
              </thead>

              <tbody id="transactionList">
                <tr>
                  <td colspan="3" class="empty">No transactions yet.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
